  <!DOCTYPE html>
  <html lang="ar" dir="rtl">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نموذج الزيارة الميدانية</title>
  <meta name="description" content="ركن الكباب البلدي - نموذج الزيارة الميدانية للفروع">
  <meta name="theme-color" content="#8b1e1e">
  <meta property="og:title" content="نموذج الزيارة الميدانية">
  <meta property="og:description" content="ركن الكباب البلدي - اضغط لفتح النموذج وتعبئته من الجوال">
  <meta property="og:type" content="website">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="نموذج الزيارة">
  <script>
  (function(){
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const x = c.getContext('2d');
    x.fillStyle = '#8b1e1e'; x.fillRect(0,0,512,512);
    x.fillStyle = '#fff'; x.fillRect(126,86,260,340);
    x.strokeStyle = '#8b1e1e'; x.lineWidth = 30; x.lineCap = 'round'; x.lineJoin = 'round';
    x.beginPath(); x.moveTo(185,262); x.lineTo(240,320); x.lineTo(335,200); x.stroke();
    const url = c.toDataURL('image/png');
    ['icon','apple-touch-icon'].forEach(rel=>{
      const l = document.createElement('link'); l.rel = rel; l.href = url; document.head.appendChild(l);
    });
    const manifest = {
      name: 'نموذج الزيارة الميدانية', short_name: 'نموذج الزيارة',
      start_url: location.href, display: 'standalone', dir: 'rtl', lang: 'ar',
      background_color: '#ffffff', theme_color: '#8b1e1e',
      icons: [{ src: url, sizes: '512x512', type: 'image/png' }]
    };
    const m = document.createElement('link'); m.rel = 'manifest';
    m.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type:'application/json'}));
    document.head.appendChild(m);
  })();
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Cairo', Tahoma, sans-serif; margin: 0; background: #eee; color: #111; font-size: 15px; }
    .wrap { max-width: 820px; margin: 0 auto; background: #fff; padding: 14px; }
    .toolbar { position: sticky; top: 0; z-index: 10; background: #fff; display: flex; gap: 8px; padding: 8px 14px; max-width: 820px; margin: 0 auto; border-bottom: 1px solid #ddd; }
    .toolbar button { flex: 1; padding: 11px; border: 0; border-radius: 8px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    .b-save { background: #8b1e1e; color: #fff; }
    .b-save:disabled { opacity: .6; }
    .b-clear { background: #eee; color: #333; }
    .brand { text-align: center; font-size: 22px; font-weight: 700; color: #8b1e1e; margin: 4px 0 0; }
    .title { text-align: center; font-size: 17px; font-weight: 700; margin: 2px 0 10px; padding-bottom: 8px; border-bottom: 3px double #8b1e1e; }
    h2 { background: #8b1e1e; color: #fff; padding: 6px 10px; font-size: 15px; margin: 16px 0 6px; border-radius: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .grid .full { grid-column: 1 / -1; }
    label.f { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 2px; }
    input[type=text], input[type=date], input[type=time], textarea, select {
      width: 100%; padding: 9px; border: 1px solid #999; border-radius: 6px; font-family: inherit; font-size: 15px; background: #fff;
    }
    textarea { min-height: 70px; resize: vertical; }
    .opts { display: flex; flex-wrap: wrap; gap: 6px; }
    .opts label { flex: 1 1 45%; }
    .opt input { display: none; }
    .opt span { display: block; text-align: center; padding: 9px 6px; border: 1px solid #999; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .opt input:checked + span { background: #8b1e1e; color: #fff; border-color: #8b1e1e; font-weight: 700; }
    .row { border: 1px solid #bbb; border-radius: 6px; padding: 8px; margin-bottom: 6px; }
    .row .q { font-weight: 600; margin-bottom: 6px; line-height: 1.5; }
    .row .seg { display: flex; gap: 6px; }
    .row .seg label { flex: 1; }
    .row .seg span { padding: 8px 4px; font-size: 18px; }
    .row .seg label.ok input:checked + span { background: #1e7a3a; border-color: #1e7a3a; }
    .row .seg label.no input:checked + span { background: #c0392b; border-color: #c0392b; }
    .row .seg label.na input:checked + span { background: #666; border-color: #666; }
    .row input[type=text] { margin-top: 6px; padding: 7px; font-size: 14px; }
    .rate { display: flex; align-items: center; gap: 8px; border: 1px solid #bbb; border-radius: 6px; padding: 8px; margin-bottom: 6px; }
    .rate .q { flex: 1; font-weight: 600; }
    .rate .opts { flex: 0 0 auto; flex-wrap: nowrap; }
    .rate .opt span { padding: 8px 12px; }
    .act { border: 1px solid #bbb; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
    .act .grid { margin-top: 6px; grid-template-columns: 1fr 1fr 1fr; }
    .sigs { display: grid; grid-template-columns: 1fr; gap: 10px; }
    .sig { border: 1px solid #777; border-radius: 6px; padding: 8px; }
    .sig b { display: block; margin-bottom: 4px; }
    canvas.sg { width: 100%; height: 100px; border: 1px dashed #999; border-radius: 6px; background: #fafafa; touch-action: none; display: block; }
    .sig button { margin-top: 4px; font-family: inherit; border: 0; background: #eee; padding: 4px 10px; border-radius: 4px; font-size: 12px; }
    .legend { font-size: 12px; color: #555; margin: 6px 0; }
    .foot { display: none; }

    /* نافذة خيارات الحفظ */
    #saveModal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 100; align-items: flex-end; justify-content: center; }
    #saveModal.show { display: flex; }
    .sheet { background: #fff; width: 100%; max-width: 520px; border-radius: 16px 16px 0 0; padding: 18px 16px 24px; }
    .sheet h3 { margin: 0 0 4px; color: #8b1e1e; font-size: 17px; }
    .sheet p { margin: 0 0 12px; font-size: 13px; color: #555; word-break: break-all; }
    .sheet button { display: block; width: 100%; padding: 13px; margin-bottom: 8px; border: 0; border-radius: 10px; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; }
    .sheet .m-share { background: #8b1e1e; color: #fff; }
    .sheet .m-down { background: #1e7a3a; color: #fff; }
    .sheet .m-close { background: #eee; color: #333; margin-bottom: 0; }

    body.pdf { background: #fff; font-size: 11px; }
    body.pdf .wrap { width: 794px; max-width: none; margin: 0; padding: 0 6px; }
    body.pdf .sig button, body.pdf .legend .hint { display: none !important; }
    body.pdf ::placeholder { color: transparent; }
    body.pdf h2 { margin: 8px 0 4px; padding: 3px 8px; font-size: 12px; }
    body.pdf .brand { font-size: 18px; }
    body.pdf .title { font-size: 14px; margin-bottom: 6px; }
    body.pdf input[type=text], body.pdf input[type=date], body.pdf input[type=time], body.pdf textarea { border: 0; border-bottom: 1px dotted #555; border-radius: 0; padding: 2px 3px; font-size: 11px; }
    body.pdf textarea { border: 1px solid #555; min-height: 90px; }
    body.pdf .grid { gap: 4px; }
    body.pdf .row { display: flex; align-items: center; gap: 6px; padding: 2px 6px; margin: 0; border-radius: 0; border-top: 0; }
    body.pdf .row .q { flex: 1; margin: 0; }
    body.pdf .row .seg { flex: 0 0 90px; gap: 2px; }
    body.pdf .row .seg span { padding: 1px 0; font-size: 12px; border-color: #ccc; color: #bbb; }
    body.pdf .row .seg input:checked + span { color: #fff; }
    body.pdf .row input[type=text] { flex: 0 0 30%; margin: 0; }
    body.pdf .rate { padding: 2px 6px; margin: 0; border-radius: 0; }
    body.pdf .rate .opt span { padding: 1px 9px; color: #bbb; border-color: #ccc; }
    body.pdf .rate .opt input:checked + span { color: #fff; }
    body.pdf .opt span { padding: 3px 6px; font-size: 11px; }
    body.pdf .opts label { flex: 1 1 auto; }
    body.pdf .act { padding: 4px 6px; margin-bottom: 4px; }
    body.pdf canvas.sg { height: 70px; border: 0; background: none; }
    body.pdf .sigs { grid-template-columns: 1fr 1fr 1fr; }
    body.pdf .foot { display: block; text-align: center; font-size: 9px; color: #777; margin-top: 8px; border-top: 1px solid #aaa; padding-top: 2px; }
  </style>
  </head>
  <body>

  <div class="toolbar">
    <button class="b-save" id="saveBtn" onclick="savePDF()">💾 حفظ الملف PDF</button>
    <button class="b-clear" onclick="clearAll()">🗑️ مسح الكل</button>
  </div>

  <!-- نافذة خيارات الحفظ -->
  <div id="saveModal">
    <div class="sheet">
      <h3>✅ الملف جاهز</h3>
      <p id="modalName"></p>
      <button class="m-share" onclick="shareNow()">📂 حفظ في الملفات / مشاركة</button>
      <button class="m-down" onclick="downloadNow()">⬇️ تنزيل مباشر</button>
      <button class="m-close" onclick="closeModal()">إغلاق</button>
    </div>
  </div>

  <div class="wrap" id="form">
    <p class="brand">ركن الكباب البلدي</p>
    <div class="title">نموذج الزيارة الميدانية للفروع</div>

    <div class="grid">
      <div><label class="f">رقم النموذج</label><input type="text" name="formno"></div>
      <div><label class="f">التاريخ</label><input type="date" name="date"></div>
      <div><label class="f">وقت الوصول</label><input type="time" name="arrive"></div>
      <div><label class="f">وقت المغادرة</label><input type="time" name="leave"></div>
    </div>

    <h2>أولاً: بيانات الزيارة</h2>
    <label class="f">الفرع</label>
    <div class="opts" id="branches"></div>
    <div class="grid" style="margin-top:8px">
      <div><label class="f">اسم الزائر</label><input type="text" name="visitor"></div>
      <div><label class="f">المنصب</label><input type="text" name="position"></div>
      <div class="full"><label class="f">مدير الفرع</label><input type="text" name="bm"></div>
    </div>
    <label class="f" style="margin-top:8px">نوع الزيارة</label>
    <div class="opts" id="vtypes"></div>
    <p class="legend">✔ مطابق &nbsp;|&nbsp; ✘ غير مطابق &nbsp;|&nbsp; – لا ينطبق</p>

    <div id="sections"></div>

    <div>
      <h2>تاسعاً: الملاحظات والإجراءات التصحيحية</h2>
      <div id="actions"></div>

      <h2>ملاحظات عامة وجوانب إيجابية</h2>
      <textarea name="generalnotes"></textarea>

      <div class="grid" style="margin-top:8px">
        <div><label class="f">الزيارة القادمة المقترحة</label><input type="date" name="nextvisit"></div>
        <div class="opts"><label class="opt"><input type="checkbox" name="followup"><span>تتطلب متابعة قبل الموعد</span></label></div>
      </div>

      <h2>الاعتمادات</h2>
      <div class="sigs" id="sigs"></div>
      <div class="foot">ركن الكباب البلدي - نموذج الزيارة الميدانية</div>
    </div>
  </div>

  <script>
  const branches = ['فرع الحمدانية','فرع الروة','فرع النزهة','فرع مخطط الرياض'];
  const vtypes = ['دورية','مفاجئة','متابعة ملاحظات سابقة','بعد شكوى'];
  const sections = [
    {t:'ثانياً: المظهر العام والنظافة', k:'s2', items:[
      'نظافة الواجهة والمدخل واللوحات والإضاءة','نظافة صالة الزبائن والطاولات والأرضيات','نظافة دورات المياه وتوفر المستلزمات','عمل التكييف والإضاءة والتجهيزات','نظافة المطبخ والأسطح والمعدات']},
    {t:'ثالثاً: الموظفون والخدمة', k:'s3', items:[
      'الالتزام بالزي الرسمي والمظهر الشخصي',
      'مطابقة الحضور الفعلي لجدول الدوام',
      'سلوك الموظفين واستقبال الزبائن',
      'سرعة تقديم الطلبات (الوقت المعتمد)',
      'سلامة الشهادات الصحية للعاملين',
      'التزام الموظفين بإجراءات التشغيل المعتمدة',
      'نظافة الزي الرسمي للموظفين',
      'نظافة الأظافر وقصّها',
      'التأكد من لبس القفازات',
      'التأكد من لبس الكمامات',
      'تغطية السواعد',
      'التزام جميع الموظفين بوضع بطاقة الاسم على الزي']},
    {t:'رابعاً: جودة الطعام وسلامته', k:'s4', pb:true, items:[
      'مطابقة الوجبات للمواصفات والأوزان المعتمدة','تجربة عينة من المنتجات (الطعم، الحرارة، التقديم)','قياس حرارة الثلاجات (0–5°م) والمجمدات (−18°م أو أقل)','وضع التواريخ والملصقات على المواد المحضّرة','فصل اللحوم النيئة عن المطبوخة، وتغطية المواد','الالتزام بقاعدة الوارد أولاً يُصرف أولاً (FIFO)','جودة زيت القلي وتغييره في مواعيده','نظافة المفاحم والأفران ومنافذ التهوية']},
    {t:'خامساً: المستودع والمخزون', k:'s5', items:[
      'ترتيب المستودع ونظافته وبعده عن الأرض والجدران','مطابقة جرد عينة من الأصناف مع النظام','فحص تواريخ الصلاحية وعدم وجود مواد منتهية','توثيق التالف والهالك بمحاضر معتمدة','تسجيل المواد الفائضة والعجز في نماذجها (يوم 25)','وجود نماذج النقل بين الفروع موقعة ومكتملة']},
    {t:'سادساً: السلامة والنظافة العامة', k:'s6', items:[
      'وجود طفايات حريق سارية الصلاحية ومخارج طوارئ سالكة','سلامة أسطوانات الغاز والتوصيلات الكهربائية','وجود حقيبة إسعافات أولية مكتملة','مكافحة الحشرات وسلامة التخلص من النفايات','سريان التراخيص (بلدية، دفاع مدني) ووضعها في مكان ظاهر']},
    {t:'سابعاً: الحسابات والمبيعات', k:'s7', items:[
      'مطابقة النقدية بالصندوق مع تقرير المبيعات','الإيداع البنكي اليومي وتوثيقه','مراجعة الخصومات والمرتجعات والإلغاءات','الالتزام بالأسعار المعتمدة وعمل أجهزة الكاشير','مراجعة تقييمات الزبائن والشكاوى ومعالجتها']}
  ];
  const axes = ['النظافة والمظهر','الموظفون والخدمة','جودة الطعام وسلامته','المستودع والمخزون','السلامة والتراخيص','الحسابات والمبيعات'];
  const signers = ['الزائر (المدير)','مدير الفرع','اعتماد الإدارة'];

  const opt = (type,name,val,label,cls='') =>
    `<label class="opt ${cls}"><input type="${type}" name="${name}" value="${val}"><span>${label}</span></label>`;

  document.getElementById('branches').innerHTML = branches.map(b=>opt('radio','branch',b,b)).join('');
  document.getElementById('vtypes').innerHTML = vtypes.map(v=>opt('radio','vtype',v,v)).join('');

  let html = '';
  sections.forEach(s=>{
    if(s.pb) html += '<div class="pb"></div>';
    html += `<h2>${s.t}</h2>`;
    s.items.forEach((q,i)=>{
      const n = `${s.k}_${i}`;
      html += `<div class="row"><div class="q">${i+1}. ${q}</div>
        <div class="seg">${opt('radio',n,'✔','✔','ok')}${opt('radio',n,'✘','✘','no')}${opt('radio',n,'–','–','na')}</div>
        <input type="text" name="${n}_note" placeholder="ملاحظات"></div>`;
    });
  });
  html += `<h2>ثامناً: التقييم العام (من 1 إلى 5)</h2>`;
  axes.forEach((a,i)=>{
    html += `<div class="rate"><div class="q">${a}</div><div class="opts">${[1,2,3,4,5].map(n=>opt('radio','rate_'+i,n,n)).join('')}</div></div>`;
  });
  document.getElementById('sections').innerHTML = html;

  let ah = '';
  for(let i=0;i<8;i++){
    ah += `<div class="act"><label class="f">الملاحظة ${i+1}</label><input type="text" name="a${i}_n">
      <div class="grid"><div><label class="f">الإجراء المطلوب</label><input type="text" name="a${i}_a"></div>
      <div><label class="f">المسؤول</label><input type="text" name="a${i}_r"></div>
      <div><label class="f">الموعد النهائي</label><input type="date" name="a${i}_d"></div></div></div>`;
  }
  document.getElementById('actions').innerHTML = ah;

  document.getElementById('sigs').innerHTML = signers.map((s,i)=>
    `<div class="sig"><b>${s}</b><label class="f">الاسم</label><input type="text" name="sn${i}">
     <label class="f" style="margin-top:6px">التوقيع</label><canvas class="sg" data-i="${i}"></canvas>
     <button type="button" onclick="clearSig(${i})">مسح التوقيع</button></div>`).join('');

  const KEY = 'visitForm_v1';
  let state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };

  document.querySelectorAll('#form input, #form textarea').forEach(el=>{
    const n = el.name; if(!n) return;
    if(el.type==='radio'){ if(state[n]===el.value) el.checked = true; }
    else if(el.type==='checkbox'){ el.checked = !!state[n]; }
    else if(state[n]!==undefined){ el.value = state[n]; }
    el.addEventListener('input',()=>{
      if(el.type==='radio') { if(el.checked) state[n]=el.value; }
      else if(el.type==='checkbox') state[n]=el.checked;
      else state[n]=el.value;
      save();
    });
  });

  const canvases = [...document.querySelectorAll('canvas.sg')];
  canvases.forEach((c,i)=>{
    const r = window.devicePixelRatio||1;
    c.width = c.clientWidth*r; c.height = c.clientHeight*r;
    const ctx = c.getContext('2d'); ctx.scale(r,r);
    ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.strokeStyle = '#000';
    if(state['sig'+i]){ const img = new Image(); img.onload=()=>ctx.drawImage(img,0,0,c.clientWidth,c.clientHeight); img.src = state['sig'+i]; }
    let drawing = false;
    const pos = e => { const b = c.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top]; };
    c.addEventListener('pointerdown',e=>{ drawing=true; c.setPointerCapture(e.pointerId); ctx.beginPath(); ctx.moveTo(...pos(e)); });
    c.addEventListener('pointermove',e=>{ if(!drawing) return; ctx.lineTo(...pos(e)); ctx.stroke(); });
    const end = ()=>{ if(!drawing) return; drawing=false; state['sig'+i]=c.toDataURL(); save(); };
    c.addEventListener('pointerup',end); c.addEventListener('pointercancel',end);
  });
  function clearSig(i){
    const c = canvases[i]; c.getContext('2d').clearRect(0,0,c.width,c.height);
    delete state['sig'+i]; save();
  }
  function clearAll(){
    if(confirm('سيتم مسح جميع البيانات المدخلة. هل أنت متأكد؟')){
      try { localStorage.removeItem(KEY); } catch(e) {}
      location.reload();
    }
  }

  /* ===== حفظ الملف PDF ===== */
  let pdfBlob = null, pdfFile = null, pdfName = '';

  function openModal(){
    document.getElementById('modalName').textContent = pdfName;
    document.getElementById('saveModal').classList.add('show');
  }
  function closeModal(){
    document.getElementById('saveModal').classList.remove('show');
  }

  async function shareNow(){
    if(!pdfFile) return;
    if(navigator.canShare && navigator.canShare({ files:[pdfFile] })){
      try{
        await navigator.share({ files:[pdfFile], title: pdfName });
        closeModal();
      }catch(e){
        if(e.name !== 'AbortError') downloadNow();
      }
    } else {
      downloadNow();
    }
  }
  function downloadNow(){
    if(!pdfBlob) return;
    const a = document.createElement('a');
    a.href = URL.createObjectURL(pdfBlob); a.download = pdfName;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 10000);
    closeModal();
  }

  async function savePDF(){
    const btn = document.getElementById('saveBtn');
    const label = btn.textContent;
    btn.disabled = true; btn.textContent = '⏳ جارٍ إنشاء الملف...';
    document.body.classList.add('pdf');
    window.scrollTo(0,0);
    let ok = false;
    try{
      const branch = (state.branch || 'فرع').replace(/\s+/g,'_');
      pdfName = `زيارة_${branch}_${state.date || new Date().toISOString().slice(0,10)}.pdf`;
      const worker = html2pdf().set({
        margin: [8,8,10,8],
        filename: pdfName,
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 2, useCORS: true, windowWidth: 794, scrollY: 0 },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css'], before: '.pb', avoid: ['.row','.rate','.act','.sig','h2'] }
      }).from(document.getElementById('form'));
      pdfBlob = await worker.outputPdf('blob');
      pdfFile = new File([pdfBlob], pdfName, { type: 'application/pdf' });
      ok = true;
    }catch(err){
      alert('تعذر إنشاء الملف، حاول مرة أخرى.');
      console.error(err);
    }finally{
      document.body.classList.remove('pdf');
      btn.disabled = false; btn.textContent = label;
    }
    if(!ok) return;

    /* محاولة فتح قائمة الحفظ مباشرة، وإن منعها الجوال تظهر النافذة */
    if(navigator.canShare && navigator.canShare({ files:[pdfFile] })){
      try{
        await navigator.share({ files:[pdfFile], title: pdfName });
      }catch(e){
        if(e.name !== 'AbortError') openModal();
      }
    } else {
      openModal();
    }
  }

  const d = document.querySelector('[name=date]');
  if(!d.value){ d.value = new Date().toISOString().slice(0,10); state.date = d.value; save(); }
  </script>
  </body>
  </html>
